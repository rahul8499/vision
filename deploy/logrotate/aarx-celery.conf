# ============================================================
# AARX Platform - Celery Log Rotation
# Placeholder: <log-dir>
# ============================================================
<log-dir>/celery-worker.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        systemctl restart aarx-celery >/dev/null 2>&1 || true
    endscript
}

<log-dir>/celery-beat.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        systemctl restart aarx-celery-beat >/dev/null 2>&1 || true
    endscript
}
