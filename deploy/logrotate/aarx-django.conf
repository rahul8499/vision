# ============================================================
# AARX Platform - Django/Uvicorn Log Rotation
# Placeholder: <log-dir>
# ============================================================
<log-dir>/django.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        systemctl reload aarx-asgi >/dev/null 2>&1 || true
    endscript
}

<log-dir>/django-error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        systemctl reload aarx-asgi >/dev/null 2>&1 || true
    endscript
}
